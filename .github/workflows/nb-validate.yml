name: nb-validate

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  validate:
    name: Validate ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # 01_eda
          - name: particle_eda
            notebook: notebooks/01_eda/particle_eda.ipynb
          - name: umap
            notebook: notebooks/01_eda/umap.ipynb
          # 02_feature_processing / 1_preprocessing
          - name: pipeline
            notebook: notebooks/02_feature_processing/1_preprocessing/pipeline.ipynb
          - name: pipeline_minimal_xgb
            notebook: notebooks/02_feature_processing/1_preprocessing/pipeline_minimal_xgb.ipynb
          # 02_feature_processing / 2_engineering
          - name: feature_exploration_xgboost
            notebook: notebooks/02_feature_processing/2_engineering/feature_exploration_xgboost.ipynb
          - name: feature_exploration_nn
            notebook: notebooks/02_feature_processing/2_engineering/feature_exploration_nn.ipynb
          - name: feature_exploration_log_regression
            notebook: notebooks/02_feature_processing/2_engineering/feature_exploration_log_regression.ipynb
          # 03_model_exploration
          - name: logistic_regression
            notebook: notebooks/03_model_exploration/Logisitic_Regression.ipynb
          - name: xgboost_baseline_v2
            notebook: notebooks/03_model_exploration/xgboost_baseline_v2.ipynb
          - name: nn_baseline_v2
            notebook: notebooks/03_model_exploration/nn_baseline_v2.ipynb
          # 04_model
          - name: xgb_optimize
            notebook: notebooks/04_model/xgb_optimize.ipynb
          - name: nn_tuning
            notebook: notebooks/04_model/nn_tuning.ipynb
          - name: hp_logistic_regression
            notebook: notebooks/04_model/HP_Logistic_Regression.ipynb
          # 05_evaluation
          - name: nn_ablation_study
            notebook: notebooks/05_evaluation/nn_ablation_study.ipynb
          - name: xgb_eval_v2
            notebook: notebooks/05_evaluation/xgb_eval_v2.ipynb
          # 06_validation
          - name: xgb_nist_validation
            notebook: notebooks/06_validation/xgb_nist_validation.ipynb
          - name: logistic_regression_nist_validation
            notebook: notebooks/06_validation/logistic_regression_nist_validation.ipynb
          - name: nn_nist_validation
            notebook: notebooks/06_validation/NN_nist_validation.ipynb

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e . --no-deps

      - name: Run nb_validate
        id: run
        continue-on-error: true
        run: python src/scripts/validation/nb_validate.py ${{ matrix.notebook }}

      - name: Show validation output dir
        if: always()
        shell: bash
        run: |
          if [ -d .artifacts_ci/validation ]; then
            ls -la .artifacts_ci/validation/
          else
            echo "No validation output dir was produced."
          fi

      - name: Upload validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nb-validate-${{ matrix.name }}
          path: .artifacts_ci/validation/
          if-no-files-found: warn

      - name: Write step summary
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.run.outcome }}" = "success" ]; then
            echo "### ${{ matrix.name }}: PASSED" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ${{ matrix.name }}: FAILED" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Notebook: \`${{ matrix.notebook }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Download the \`nb-validate-${{ matrix.name }}\` artifact for the full Markdown report." >> "$GITHUB_STEP_SUMMARY"

      - name: Fail job if validation failed
        if: steps.run.outcome != 'success'
        shell: bash
        run: |
          echo "::error title=Notebook validation failed::See the nb-validate-${{ matrix.name }} artifact for the Markdown error report."
          exit 1
